[package]
name = "jdpackager"
version = "0.1.0"
edition = "2021"
description = "Convert a scraper books.json into a JDownloader .crawljob link container"
license = "MIT"

[[bin]]
name = "jdpackager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
